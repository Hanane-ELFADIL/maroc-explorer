spring.data.mongodb.uri=mongodb://localhost:27017/maroc_tourisme
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# Dossier des images (relatif à la racine du projet ou chemin absolu)
app.images-dir=images
# Nombre de résultats par page sur /explore
app.page-size=12
# Import des données au démarrage : missing (ajoute les éléments absents) | reset (efface et réimporte) | off
app.seed=missing
# Affiche le détail des erreurs (à désactiver en production)
server.error.include-message=always
# Photos réelles (Wikipédia / Wikimedia Commons) téléchargées automatiquement dans images/ : auto | off
app.photos=auto
# true = réessayer les éléments sans résultat lors d'un précédent démarrage
app.photos.retry=false
# Wikimedia demande un contact dans le User-Agent : mettez votre e-mail ici (recommandé)
app.photos.contact=projet-etudiant
# Délai entre deux requêtes (ms). Augmentez-le (ex. 3000) si vous voyez encore "limite de debit"
app.photos.delay-ms=1500

about.title=À propos de Maroc Explorer
about.p1=Maroc Explorer est un guide de voyage pour découvrir les villes du Maroc : attractions, hébergements, restaurants, activités, événements et transports.
about.p2=Les données sont stockées dans MongoDB. Pour ajouter une ville, il suffit d'insérer un document dans la collection cities puis ses lieux : le menu, la page de la ville et la recherche se mettent à jour automatiquement.
about.p3=Les prix, horaires et coordonnées sont des estimations à vérifier avant de réserver. Les photos proviennent du dossier images/ ou de Wikipédia.

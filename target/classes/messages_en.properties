about.title=About Maroc Explorer
about.p1=Maroc Explorer is a travel guide to discover Moroccan cities: attractions, stays, restaurants, activities, events and transport.
about.p2=Data lives in MongoDB. To add a city, insert a document in the cities collection and then its places: the menu, the city page and the search update automatically.
about.p3=Prices, hours and coordinates are estimates to verify before booking. Photos come from the images/ folder or from Wikipedia.
